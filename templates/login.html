<!DOCTYPE html>
<html lang="th">
<head>
  <title>Login - DocSearch Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .login-container { margin-top: 100px; }
  </style>
</head>
<body>

<div class="container login-container">
  <div class="row justify-content-center">
    <div class="col-md-4 text-center">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="mb-4">DocSearch Pro</h2>
          <p class="text-muted mb-4">Please sign in with your Google account to continue.</p>
          <a href="/DocSearchPro/login" class="btn btn-outline-dark btn-lg w-100">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:20px; margin-right:8px;">
            Sign in with Google
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
